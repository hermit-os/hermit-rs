[package]
name = "axum-example"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = "1"
serde = { version = "1", features = ["derive"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
tokio = { version = "1", features = ["rt-multi-thread"] }

[target.'cfg(target_os = "hermit")'.dependencies]
hermit = { path = "../../hermit" }
